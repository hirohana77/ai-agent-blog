<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Subtle Apple dark ceramic gradient -->
    <linearGradient id="appleDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2c"/>
      <stop offset="100%" stop-color="#141415"/>
    </linearGradient>

    <!-- Action Blue glow for agent core -->
    <linearGradient id="agentBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Apple iOS-style Squircle Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#appleDarkGrad)" stroke="#3a3a3c" stroke-width="1.2"/>

  <!-- Subtle Inner Hairline Ring -->
  <rect x="3.2" y="3.2" width="57.6" height="57.6" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.8"/>

  <!-- Autonomous Agent Core Motif: Neural Synapse & Deliberation Orbit -->
  <!-- Orbit Path -->
  <circle cx="32" cy="32" r="15" fill="none" stroke="rgba(41, 151, 255, 0.25)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Satellite Nodes -->
  <circle cx="32" cy="17" r="2.5" fill="#2997ff"/>
  <circle cx="45" cy="39.5" r="2.5" fill="#2997ff"/>
  <circle cx="19" cy="39.5" r="2.5" fill="#2997ff"/>

  <!-- Glowing Agent Spark Core -->
  <g filter="url(#softGlow)">
    <!-- 4-point precision star / deliberation nexus -->
    <path d="M32 23 C32 28.5 28.5 32 23 32 C28.5 32 32 35.5 32 41 C32 35.5 35.5 32 41 32 C35.5 32 32 28.5 32 23 Z" fill="url(#agentBlueGrad)"/>
    <!-- Center white core dot -->
    <circle cx="32" cy="32" r="2" fill="#ffffff"/>
  </g>
</svg>
